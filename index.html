<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>STOP ME</title>
    <meta name="theme-color" content="#16131F">
    <!-- iPhone'da "Ana Ekrana Ekle" ile tam ekran uygulama gibi açılması için -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="STOP ME">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <!-- styles.css yüklenemese bile ekran beyaz kalmasın -->
    <style>html,body{background:#16131F;color:#F3EFF7;margin:0;font-family:system-ui,-apple-system,sans-serif}</style>
</head>
<body>
    <div id="loading">STOP ME yükleniyor…</div>
    <div id="unsupported" hidden>
        Bu tarayıcı STOP ME'yi çalıştıramıyor.<br>
        iPhone'da en az iOS 18.2 gerekiyor. Lütfen telefonunu güncelle.
    </div>
    <div id="failed" hidden>
        STOP ME açılamadı 😕<br>
        Bu ekranın görüntüsünü Selin'e gönderir misin?<br><br>
        <small id="failedInfo" style="opacity:.7;word-break:break-word"></small>
    </div>
    <div id="composeTarget"></div>
    <script>
        // Teşhis paneli: adrese ?debug=1 eklenince ekranın üstünde dokunuşları, boyutları ve hataları gösterir.
        if (new URLSearchParams(location.search).has("debug")) {
            const box = document.createElement("pre");
            box.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99;margin:0;padding:6px 8px;" +
                "font:11px/1.35 ui-monospace,monospace;color:#0f0;background:rgba(0,0,0,.75);" +
                "pointer-events:none;white-space:pre-wrap;word-break:break-all;max-height:45vh;overflow:hidden";
            document.addEventListener("DOMContentLoaded", () => document.body.appendChild(box));
            const errors = [];
            let last = "-";
            const render = () => {
                const c = document.getElementById("composeTarget").firstElementChild;
                const vv = window.visualViewport;
                box.textContent = [
                    navigator.userAgent,
                    `window ${innerWidth}x${innerHeight} dpr ${devicePixelRatio}` +
                        (vv ? ` | visual ${Math.round(vv.width)}x${Math.round(vv.height)} @${Math.round(vv.offsetTop)}` : ""),
                    c ? `uygulama alanı ${Math.round(c.getBoundingClientRect().width)}x${Math.round(c.getBoundingClientRect().height)}` +
                        ` | başladı: ${started}` : "uygulama alanı yok",
                    `son olay: ${last}`,
                    ...errors.slice(-6),
                ].join("\n");
            };
            ["pointerdown", "pointerup", "touchstart", "touchend", "click"].forEach(t =>
                window.addEventListener(t, e => {
                    const p = e.touches?.[0] || e.changedTouches?.[0] || e;
                    last = `${t} ${Math.round(p.clientX)},${Math.round(p.clientY)}`;
                    render();
                }, { capture: true, passive: true }));
            window.addEventListener("error", e => { errors.push("HATA: " + (e.message || e.target?.src)); render(); }, true);
            window.addEventListener("unhandledrejection", e => { errors.push("HATA (promise): " + e.reason); render(); });
            setInterval(render, 1000);
        }
    </script>
    <script>
        // Nefes egzersizi sesi (Kotlin tarafı window.stopmeAudio'yu çağırır).
        // iPhone Safari sesi ancak bir dokunuşla açtığı için AudioContext ilk dokunuşta oluşturulur.
        window.stopmeAudio = (() => {
            let ctx = null, gain = null, src = null, muted = false, gen = 0;
            const cache = {};
            function ensure() {
                const C = window.AudioContext || window.webkitAudioContext;
                if (!C) return null;
                if (!ctx) { ctx = new C(); gain = ctx.createGain(); gain.connect(ctx.destination); }
                if (ctx.state === "suspended") ctx.resume();
                return ctx;
            }
            ["touchend", "pointerdown", "keydown"].forEach(e =>
                window.addEventListener(e, ensure, { capture: true, passive: true }));
            function stopSource() {
                if (src) { try { src.stop(); } catch (e) {} src = null; }
            }
            return {
                start: async (path, isMuted) => {
                    const my = ++gen;
                    const url = new URL(path, document.baseURI).href;
                    muted = isMuted;
                    try {
                        const c = ensure();
                        if (!c) return;
                        cache[url] = cache[url] || fetch(url).then(r => r.arrayBuffer())
                            .then(b => new Promise((ok, fail) => c.decodeAudioData(b, ok, fail)));
                        const buffer = await cache[url];
                        if (my !== gen) return;
                        stopSource();
                        src = c.createBufferSource();
                        src.buffer = buffer;
                        src.connect(gain);
                        gain.gain.value = muted ? 0 : 1;
                        src.start();
                    } catch (e) { console.warn("ses çalınamadı", e); }
                },
                stop: () => { gen++; stopSource(); },
                setMuted: m => { muted = m; if (gain) gain.gain.value = m ? 0 : 1; },
            };
        })();
    </script>
    <script>
        // Bir şey ters giderse beyaz/boş ekran yerine sebebini göster
        let started = false;
        function showFailure(reason) {
            if (started) return;
            document.getElementById("loading").hidden = true;
            document.getElementById("failed").hidden = false;
            document.getElementById("failedInfo").textContent = reason + " | " + navigator.userAgent;
        }
        window.addEventListener("error", e => showFailure(String(e.message || e.target?.src || "error")), true);
        window.addEventListener("unhandledrejection", e => showFailure(String(e.reason)));
        setTimeout(() => showFailure("zaman aşımı (30 sn)"), 30000);
        // WebAssembly GC desteği yoksa (eski iOS) kullanıcıya açıklama göster
        (async () => {
            const gcProbe = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,95,1,120,0]);
            if (!(typeof WebAssembly === "object" && WebAssembly.validate(gcProbe))) {
                document.getElementById("loading").hidden = true;
                document.getElementById("unsupported").hidden = false;
                started = true;
                return;
            }
            const s = document.createElement("script");
            s.src = "webApp.js?v=20261117183020";
            document.body.appendChild(s);
            // Compose, çizim alanını #composeTarget içine (kapalı bir shadow DOM'a) ekler;
            // canvas'ı göremeyiz, o yüzden "bir şey eklendi mi" diye bakıyoruz.
            const target = document.getElementById("composeTarget");
            const markStarted = () => {
                if (started || !target.firstElementChild) return false;
                started = true;
                document.getElementById("loading").hidden = true;
                document.getElementById("failed").hidden = true; // erken gelen önemsiz bir hata yüzünden açıldıysa kapat
                return true;
            };
            if (!markStarted()) {
                new MutationObserver((_, obs) => { if (markStarted()) obs.disconnect(); })
                    .observe(target, { childList: true });
            }
        })();
    </script>
</body>
</html>
